# Put inside your existing server { } block for quditwolf.qutrit.org.
# Replace 10.0.0.2 with the homeserver's VPN IP. /pulse redirects to /pulse/ automatically.
location /pulse/ {
    proxy_pass http://10.0.0.2:5002/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    client_max_body_size 8k;
}
