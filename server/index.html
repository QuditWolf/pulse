<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.30/dist/uPlot.min.css">
<script src="https://cdn.jsdelivr.net/npm/uplot@1.6.30/dist/uPlot.iife.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --fg: #1b1f24; --muted: #6a737d; --border: #e1e4e8;
    --ok: #1a7f37; --bad: #cf222e; --grid: #eaecef; --hover: #f0f2f5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1116; --card: #161b22; --fg: #e6edf3; --muted: #8b949e; --border: #30363d;
            --ok: #3fb950; --bad: #f85149; --grid: #21262d; --hover: #1c2129; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; }
  .tools { display: flex; gap: 8px; align-items: center; }
  .ranges button { background: var(--card); color: var(--fg); border: 1px solid var(--border);
                   padding: 4px 10px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 13px; }
  .ranges button.on { border-color: var(--fg); font-weight: 600; }
  #logout { background: none; border: 0; color: var(--muted); cursor: pointer; font: inherit; font-size: 13px; }

  .host { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
          padding: 16px; margin-top: 16px; }
  .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .name { font-weight: 600; font-size: 17px; }
  .state { font-size: 13px; color: var(--muted); }
  .temps { margin-left: auto; display: flex; gap: 14px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
  .temps span b { font-size: 17px; }
  .temps span small { color: var(--muted); margin-right: 4px; }
  .temps span small.lim { margin: 0 0 0 6px; font-size: 12px; }
  .info { flex-basis: 100%; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .chart { margin-top: 14px; width: 100%; overflow: hidden; }
  .chart h3 { margin: 0 0 4px; font-size: 13px; font-weight: 600; }
  .chart .cap { margin: 4px 0 0; font-size: 12px; color: var(--muted); line-height: 1.45; }
  .chart .cap b { color: var(--fg); font-weight: 600; }
  .chart .now { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 2px 0 6px; font-size: 13px;
                font-variant-numeric: tabular-nums; }
  .chart .now span { display: inline-flex; align-items: baseline; gap: 5px; }
  .chart .now i { width: 9px; height: 9px; border-radius: 2px; align-self: center; }
  .chart .now small { color: var(--muted); }
  .chart .now b { font-size: 15px; }
  .uplot { font-family: inherit; }
  .u-legend { color: var(--fg); font-size: 12px; }

  details.sensors { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
  details.sensors summary { cursor: pointer; color: var(--muted); font-size: 13px; user-select: none; }
  .sensor-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
                 gap: 2px 12px; margin-top: 8px; }
  .sensor-list .grp { grid-column: 1 / -1; font-size: 12px; color: var(--muted); font-weight: 600;
                      margin: 6px 0 2px; text-transform: uppercase; letter-spacing: .04em; }
  .sensor-list label { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 6px;
                       cursor: pointer; font-size: 13px; font-variant-numeric: tabular-nums; }
  .sensor-list label:hover { background: var(--hover); }
  .sensor-list .sn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sensor-list .sv { font-weight: 600; }
  .sensor-list .sl { color: var(--muted); font-size: 11px; min-width: 52px; text-align: right; }
  .sensor-actions { margin-top: 6px; display: flex; gap: 10px; }
  .sensor-actions button { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer;
                           font: inherit; font-size: 12px; text-decoration: underline; }

  footer { color: var(--muted); font-size: 12px; margin-top: 20px; text-align: center; }
  .err { color: var(--bad); }
  .hidden { display: none !important; }
  #login { max-width: 320px; margin: 15vh auto 0; background: var(--card); border: 1px solid var(--border);
           border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  #login h1 { margin-bottom: 4px; }
  #login input, #login button { font: inherit; padding: 8px 10px; border-radius: 6px;
           border: 1px solid var(--border); background: var(--bg); color: var(--fg); }
  #login button { background: var(--fg); color: var(--bg); border-color: var(--fg); cursor: pointer; font-weight: 600; }
  #login .err { font-size: 13px; min-height: 1em; margin: 0; }
</style>
</head>
<body>
<form id="login" class="hidden" autocomplete="on">
  <h1>Pulse</h1>
  <input type="text" name="username" value="pulse" autocomplete="username" hidden>
  <input id="pw" type="password" name="password" placeholder="Password" autocomplete="current-password" required autofocus>
  <button type="submit">Log in</button>
  <p class="err" id="loginErr"></p>
</form>
<main id="app" class="hidden">
  <header>
    <h1>Pulse</h1>
    <div class="tools">
      <div class="ranges" id="ranges">
        <button data-h="6">6h</button><button data-h="24" class="on">24h</button><button data-h="168">7d</button>
      </div>
      <button id="logout" type="button">log out</button>
    </div>
  </header>
  <div id="hosts"></div>
  <footer id="foot">loading…</footer>
</main>
<script>
const COLORS = ["#e8590c", "#1c7ed6", "#2f9e44", "#ae3ec9", "#f08c00", "#0c8599", "#d6336c", "#5c940d",
                "#3b5bdb", "#c2255c", "#087f5b", "#e67700"];
let hours = 24;
let lastStatus = null;
let statusAt = 0;          // performance.now() when lastStatus arrived, for live "x s ago" text
let uiVersion = null;      // server's page version; a change means a new deploy -> reload
const drawnKey = {};       // per host: what the chart currently shows, to skip refetching unchanged data
const POLL_MS = 15000;
const charts = {};

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const ago = s => s < 90 ? `${s}s ago` : s < 5400 ? `${Math.round(s / 60)}m ago`
              : s < 172800 ? `${Math.round(s / 3600)}h ago` : `${Math.round(s / 86400)}d ago`;
const NAMES = { cpu_pct: "CPU", mem_pct: "RAM", load_pct: "Load", gpu_pct: "GPU avg", vram_pct: "VRAM",
                disk_busy_pct: "Disk busy", disk_read_mbs: "Disk read", disk_write_mbs: "Disk write" };
const label = m => NAMES[m] ? NAMES[m].toUpperCase()
  : m.replace(/^gpu(\d+)_vram_pct$/, "gpu $1 vram").replace(/^gpu(\d+)_pct$/, "gpu $1").replace(/_/g, " ").toUpperCase();
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls;
                                  if (text != null) e.textContent = text; return e; };
const fmt = v => (Math.round(v * 10) / 10).toString();
// Metric kind from its name: *_pct = percent, *_mbs = MB/s, everything else = temperature.
const kind = m => /_pct$/.test(m) ? "pct" : /_mbs$/.test(m) ? "io" : "temp";
const KINDS = {
  temp: { title: "Temperature", unit: "°C", short: "°", group: "Temperatures" },
  pct:  { title: "Usage", unit: "%", short: "%", group: "Usage" },
  io:   { title: "Disk I/O", unit: " MB/s", short: "", group: "Disk I/O" },
};
const show = (m, v) => kind(m) === "io" ? fmt(v) + " MB/s" : Math.round(v) + KINDS[kind(m)].unit;
const limText = (lim, m) => { const u = KINDS[kind(m)].short;
  return lim[0] != null && lim[1] != null ? `${fmt(lim[0])}–${fmt(lim[1])}${u}`
       : lim[1] != null ? `≤${fmt(lim[1])}${u}` : `≥${fmt(lim[0])}${u}`; };
const dur = s => s >= 86400 ? `${Math.floor(s / 86400)}d ${Math.floor(s % 86400 / 3600)}h`
               : s >= 3600 ? `${Math.floor(s / 3600)}h ${Math.floor(s % 3600 / 60)}m` : `${Math.floor(s / 60)}m`;
// What each usage line means, shown under the usage chart for the lines it contains.
function usageNote(m) {
  if (m === "cpu_pct") return ["CPU", "share of time all cores were busy since the last push (about 1 min)."];
  if (m === "mem_pct") return ["RAM", "memory in use, page cache excluded. Red above 90%."];
  if (m === "load_pct") return ["Load", "1-min load average ÷ cores. 100% = every core has work; above 100% = tasks are waiting."];
  if (/^gpu\d*_pct$/.test(m)) return ["GPU", "share of time kernels were running (GPU without a number = average over all GPUs)."];
  if (/vram_pct$/.test(m)) return ["VRAM", "GPU memory allocated. Frameworks often reserve most of it up front, so high is normal."];
  if (m === "disk_busy_pct") return ["Disk busy", "share of time the busiest disk had I/O in flight. 100% saturates an HDD or SATA SSD; NVMe can still take more in parallel."];
  return null;
}
const CAPTIONS = {
  temp: () => "Readings turn red outside the limits their sensor reports.",
  io: () => "Read and write throughput summed over physical disks, averaged since the last push (about 1 min).",
};
const outOfRange = (v, lim) => lim && ((lim[0] != null && v < lim[0]) || (lim[1] != null && v > lim[1]));

const order = h => (h.order && h.order.length ? h.order : Object.keys(h.latest).sort()).filter(m => m in h.latest);

// Per-host sensor selection, remembered in this browser only.
function getSel(h) {
  let sel = null;
  try { sel = JSON.parse(localStorage.getItem("pulse.sel2." + h.host)); } catch (e) {}
  if (!Array.isArray(sel)) sel = [];
  sel = sel.filter(m => m in h.latest);
  // Default: the agent's PULSE_DEFAULTS list, else the first metric it sent.
  if (!sel.length) sel = (h.defaults && h.defaults.length) ? h.defaults.slice() : order(h).slice(0, 1);
  return sel;
}
function setSel(host, sel) {
  try { localStorage.setItem("pulse.sel2." + host, JSON.stringify(sel)); } catch (e) {}
}

class AuthError extends Error {}
async function api(path) {
  const r = await fetch(path, { credentials: "same-origin" });
  if (r.status === 401) throw new AuthError();
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

function showLogin(msg) {
  document.getElementById("app").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
  document.getElementById("loginErr").textContent = msg || "";
  document.getElementById("pw").focus();
}

function card(h) {
  let c = document.getElementById("h-" + h.host);
  if (!c) {
    c = el("section", "host"); c.id = "h-" + h.host;
    const head = el("div", "head");
    head.append(el("span", "dot"), el("span", "name", h.host), el("span", "state"), el("div", "temps"), el("div", "info"));
    const det = el("details", "sensors");
    det.append(el("summary"), el("div", "sensor-list"), el("div", "sensor-actions"));
    c.append(head, el("div", "charts"), det);
    document.getElementById("hosts").append(c);
  }
  return c;
}

function renderHead(c, h, sel, now) {
  c.querySelector(".dot").style.background = h.online ? css("--ok") : css("--bad");
  c.querySelector(".state").textContent = (h.online ? "online" : "offline") +
    (h.last_seen ? " · " + ago(now - h.last_seen) : " · never seen");
  const temps = c.querySelector(".temps"); temps.textContent = "";
  for (const m of order(h).filter(x => sel.includes(x) && kind(x) === "temp")) {
    const v = h.latest[m], lim = (h.limits || {})[m];
    const s = el("span"), b = el("b", null, show(m, v));
    if (outOfRange(v, lim)) b.style.color = css("--bad");
    s.append(el("small", null, label(m)), b);
    if (lim) s.append(el("small", "lim", "limit " + limText(lim, m)));
    if (!h.online) s.style.opacity = 0.5;
    temps.append(s);
  }
  const i = h.info || {}, parts = [];
  if (i.uptime != null && h.last_seen) parts.push((h.online ? "up " : "was up ") + dur(i.uptime + (h.online ? now - h.last_seen : 0)));
  if (i.ncpu) parts.push(i.ncpu + " cores");
  if (i.mem_gb) parts.push(fmt(i.mem_gb) + " GB RAM");
  if (i.load1 != null) parts.push(`load ${i.load1.toFixed(2)} · ${i.load5.toFixed(2)} · ${i.load15.toFixed(2)} (1/5/15 min)`);
  c.querySelector(".info").textContent = parts.join("  ·  ");
}

function renderSensors(c, h, sel) {
  const all = order(h);
  c.querySelector("summary").textContent = `Sensors (${sel.length} of ${all.length} shown)`;
  const list = c.querySelector(".sensor-list"); list.textContent = "";
  const grouped = Object.keys(KINDS).flatMap(k => all.filter(m => kind(m) === k));
  let lastKind = null;
  for (const m of grouped) {
    if (kind(m) !== lastKind) { lastKind = kind(m); list.append(el("div", "grp", KINDS[lastKind].group)); }
    const v = h.latest[m], lim = (h.limits || {})[m];
    const row = el("label"), cb = el("input");
    cb.type = "checkbox"; cb.checked = sel.includes(m);
    cb.addEventListener("change", () => {
      const cur = getSel(h).filter(x => x !== m);
      if (cb.checked) cur.push(m);
      setSel(h.host, cur.length ? cur : [m]);   // never leave a host with nothing selected
      if (!cur.length) cb.checked = true;
      renderHost(h, lastStatus.now);
    });
    const val = el("span", "sv", show(m, v));
    if (outOfRange(v, lim)) val.style.color = css("--bad");
    row.append(cb, el("span", "sn", label(m)), val, el("span", "sl", lim ? limText(lim, m) : ""));
    row.title = m;
    list.append(row);
  }
  const act = c.querySelector(".sensor-actions"); act.textContent = "";
  const allBtn = el("button", null, "show all"), defBtn = el("button", null, "reset");
  allBtn.type = defBtn.type = "button";
  allBtn.onclick = () => { setSel(h.host, all); renderHost(h, lastStatus.now); };
  defBtn.onclick = () => { try { localStorage.removeItem("pulse.sel2." + h.host); } catch (e) {} renderHost(h, lastStatus.now); };
  act.append(allBtn, defBtn);
}

// One chart per kind (temperature, usage %, disk MB/s), each only when a metric of that kind is selected.
function renderCharts(c, h, data, sel) {
  const host = h.host;
  const wrap = c.querySelector(".charts");
  for (const k of Object.keys(KINDS)) {
    const id = host + "|" + k;
    const metrics = sel.filter(m => kind(m) === k && m in data.series);
    let box = wrap.querySelector(`.chart[data-k="${k}"]`);
    if (!metrics.length) { if (charts[id]) { charts[id].u.destroy(); delete charts[id]; } if (box) box.remove(); continue; }
    if (!box) {
      box = el("div", "chart"); box.dataset.k = k;
      box.append(el("h3", null, `${KINDS[k].title} (${KINDS[k].unit.trim()})`), el("div", "now"), el("div", "plot"), el("p", "cap"));
      // Keep the order temperature, usage, disk regardless of when each appears.
      const after = [...wrap.children].find(x => Object.keys(KINDS).indexOf(x.dataset.k) > Object.keys(KINDS).indexOf(k));
      wrap.insertBefore(box, after || null);
    }
    // Latest value of each line, always visible (temperatures already show in the host header).
    const now = box.querySelector(".now"); now.textContent = "";
    if (k !== "temp") metrics.forEach((m, i) => {
      if (!(m in h.latest)) return;
      const v = h.latest[m], sw = el("i"), b = el("b", null, show(m, v));
      sw.style.background = COLORS[i % COLORS.length];
      if (outOfRange(v, (h.limits || {})[m])) b.style.color = css("--bad");
      const s = el("span"); s.append(sw, el("small", null, label(m)), b);
      if (!h.online) s.style.opacity = 0.5;
      now.append(s);
    });
    const cap = box.querySelector(".cap"); cap.textContent = "";
    if (k === "pct") {
      const seen = new Set();
      for (const m of metrics) { const n = usageNote(m); if (!n || seen.has(n[0])) continue; seen.add(n[0]);
        if (cap.childNodes.length) cap.append(" ");
        cap.append(el("b", null, n[0] + ":"), " " + n[1]); }
      cap.prepend("0–100% of each resource's capacity. ");
    } else cap.textContent = CAPTIONS[k]();
    drawPlot(box.querySelector(".plot"), id, k, data, metrics);
  }
}

function drawPlot(box, id, k, data, metrics) {
  const key = metrics.join(",");
  const width = box.clientWidth || 600, height = k === "temp" ? 220 : 160;
  const rows = [data.ts, ...metrics.map(m => data.series[m])];
  const old = charts[id];
  if (old && old.key === key) { old.u.setData(rows); old.u.setSize({ width, height }); return; }
  if (old) old.u.destroy();
  box.textContent = "";
  if (!data.ts.length) { box.append(el("div", "state", "no data in range")); delete charts[id]; return; }
  const axis = { stroke: css("--muted"), grid: { stroke: css("--grid"), width: 1 }, ticks: { stroke: css("--grid") } };
  const u = KINDS[k];
  const range = k === "pct" ? (u_, lo, hi) => [0, Math.max(100, hi || 0)]
              : k === "io" ? (u_, lo, hi) => [0, hi > 0 ? hi * 1.1 : 1] : undefined;
  const plot = new uPlot({
    width, height,
    scales: { x: { time: true }, y: range ? { range } : {} },
    axes: [axis, { ...axis, size: 56, values: (_, v) => v.map(x => x + u.short) }],
    series: [{}, ...metrics.map((m, i) => ({
      label: label(m), stroke: COLORS[i % COLORS.length], width: 1.5, spanGaps: false,
      value: (_, v) => v == null ? "–" : (k === "temp" ? v.toFixed(1) + "°C" : k === "pct" ? v.toFixed(1) + "%" : v.toFixed(2) + " MB/s"),
    }))],
  }, rows, box);
  charts[id] = { u: plot, key, height };
}

async function renderHost(h, now, force) {
  const c = card(h), sel = getSel(h);
  renderHead(c, h, sel, now);
  renderSensors(c, h, sel);
  // Only refetch history when the host pushed new data or the view changed (range, sensors, a minute passed).
  const key = [h.last_seen, hours, sel.join(","), Math.floor(Date.now() / 60000)].join("|");
  if (!force && drawnKey[h.host] === key) return;
  const q = `api/history?host=${encodeURIComponent(h.host)}&hours=${hours}&metrics=${encodeURIComponent(sel.join(","))}`;
  renderCharts(c, h, await api(q), sel);
  drawnKey[h.host] = key;
}

// Keep "online · 12s ago" ticking between polls, and flip to offline locally if a host goes quiet.
function tick() {
  if (!lastStatus) return;
  const now = lastStatus.now + Math.round((performance.now() - statusAt) / 1000);
  for (const h of lastStatus.hosts) {
    const c = document.getElementById("h-" + h.host);
    if (!c) continue;
    const online = h.last_seen != null && now - h.last_seen <= lastStatus.offline_after;
    c.querySelector(".dot").style.background = online ? css("--ok") : css("--bad");
    c.querySelector(".state").textContent = (online ? "online" : "offline") +
      (h.last_seen ? " · " + ago(now - h.last_seen) : " · never seen");
  }
  const f = document.getElementById("foot");
  if (f.className !== "err") f.textContent = "live · checked " + ago(Math.round((performance.now() - statusAt) / 1000));
}

let busy = false;
async function refresh(force) {
  if (busy) return;
  busy = true;
  try {
    const st = await api("api/status");
    if (uiVersion && st.ui && st.ui !== uiVersion) return location.reload();
    uiVersion = st.ui;
    lastStatus = st; statusAt = performance.now();
    document.getElementById("login").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    for (const h of st.hosts) await renderHost(h, st.now, force);
    document.getElementById("foot").className = "";
    tick();
  } catch (e) {
    if (e instanceof AuthError) return showLogin();
    const f = document.getElementById("foot"); f.textContent = "update failed: " + e.message + " · retrying"; f.className = "err";
  } finally {
    busy = false;
  }
}

document.getElementById("ranges").addEventListener("click", e => {
  if (!e.target.dataset.h) return;
  hours = +e.target.dataset.h;
  for (const b of document.querySelectorAll(".ranges button")) b.classList.toggle("on", b === e.target);
  refresh(true);
});
window.addEventListener("resize", () => {
  for (const { u, height } of Object.values(charts)) {
    const box = u.root.parentElement;
    if (box) u.setSize({ width: box.clientWidth, height });
  }
});
document.getElementById("login").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = document.getElementById("pw");
  const r = await fetch("login", { method: "POST", credentials: "same-origin",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: pw.value }) });
  if (r.ok) { pw.value = ""; return refresh(true); }
  const j = await r.json().catch(() => ({}));
  showLogin(j.error || "login failed");
});
document.getElementById("logout").addEventListener("click", async () => {
  await fetch("logout", { method: "POST", credentials: "same-origin" });
  showLogin();
});
refresh();
const loggedIn = () => document.getElementById("login").classList.contains("hidden");
setInterval(() => { if (loggedIn() && !document.hidden) refresh(); }, POLL_MS);
setInterval(tick, 5000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && loggedIn()) refresh(); });
</script>
</body>
</html>
